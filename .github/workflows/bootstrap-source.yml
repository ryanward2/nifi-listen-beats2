name: Restore published source tree

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect reconstructed payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap-payload/part-* > /tmp/listenbeats2.b64
          python3 - <<'PY'
          import base64, gzip, io, pathlib, shutil, tarfile, zipfile
          encoded = pathlib.Path('/tmp/listenbeats2.b64').read_text()
          raw = base64.b64decode(''.join(encoded.split()))
          out = pathlib.Path('/tmp/listenbeats2-restored')
          shutil.rmtree(out, ignore_errors=True)
          out.mkdir(parents=True)
          candidates=[raw]
          try: candidates.append(gzip.decompress(raw))
          except Exception: pass
          for data in candidates:
              try:
                  with tarfile.open(fileobj=io.BytesIO(data), mode='r:*') as tf:
                      tf.extractall(out)
                      print('EXTRACTED_AS_TAR')
                      break
              except Exception: pass
              try:
                  with zipfile.ZipFile(io.BytesIO(data)) as zf:
                      zf.extractall(out)
                      print('EXTRACTED_AS_ZIP')
                      break
              except Exception: pass
          PY
          echo '--- extracted tree ---'
          find /tmp/listenbeats2-restored -maxdepth 4 -print | sort | head -300
          echo '--- file types ---'
          find /tmp/listenbeats2-restored -maxdepth 3 -type f -print0 | xargs -0 -r file | head -100
          exit 1
