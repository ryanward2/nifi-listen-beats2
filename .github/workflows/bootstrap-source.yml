name: Publish ListenBeats2 source tree

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct staged source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap-payload/part-* > /tmp/listenbeats2.b64
          python3 - <<'PY'
          import base64, pathlib
          encoded = pathlib.Path('/tmp/listenbeats2.b64').read_text()
          raw = base64.b64decode(''.join(encoded.split()))
          pathlib.Path('/tmp/listenbeats2.tar.gz').write_bytes(raw)
          PY
          rm -rf /tmp/listenbeats2-restored
          mkdir -p /tmp/listenbeats2-restored
          tar -xzf /tmp/listenbeats2.tar.gz -C /tmp/listenbeats2-restored
          echo "Restored files: $(find /tmp/listenbeats2-restored -type f | wc -l)"
          test -f /tmp/listenbeats2-restored/README.md
          test -f /tmp/listenbeats2-restored/nifi-listen-beats2-api/pom.xml
          test -f /tmp/listenbeats2-restored/nifi-listen-beats2-services/pom.xml
          test -f /tmp/listenbeats2-restored/nifi-listen-beats2-processors/pom.xml
          test -f /tmp/listenbeats2-restored/nifi-listen-beats2-nar/pom.xml
          test "$(find /tmp/listenbeats2-restored -name '*.java' -type f | wc -l)" -gt 50

      - name: Replace staging tree with source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/listenbeats2-restored/ ./
          test -f README.md
          test -d nifi-listen-beats2-services/src/main/java
          test -d nifi-listen-beats2-processors/src/main/java
          echo "Published Java files: $(find . -name '*.java' -type f | wc -l)"

      - name: Commit source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Publish ListenBeats2 1.0.0 source for Apache NiFi 2.11.0"
          git push origin HEAD:main
