name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set up Maven 3.9.16
        shell: bash
        run: |
          MAVEN_VERSION=3.9.16
          MAVEN_SHA512=831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
          MAVEN_ARCHIVE=apache-maven-${MAVEN_VERSION}-bin.tar.gz
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/${MAVEN_ARCHIVE}" \
            "https://dlcdn.apache.org/maven/maven-3/${MAVEN_VERSION}/binaries/${MAVEN_ARCHIVE}"
          echo "${MAVEN_SHA512}  ${RUNNER_TEMP}/${MAVEN_ARCHIVE}" | sha512sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${MAVEN_ARCHIVE}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}/bin" >> "${GITHUB_PATH}"
      - name: Build and test
        run: mvn -B -T1C clean verify
      - name: Prepare release artifacts
        shell: bash
        run: |
          mkdir -p release
          cp nifi-listen-beats2-nar/target/*.nar release/
          (cd release && sha256sum *.nar > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --generate-notes --title "ListenBeats2 ${GITHUB_REF_NAME}"
